spring.application.name=sors-backend
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/sorsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=${JWT_SECRET:uep-sors-super-secret-jwt-key-2026-secure}
jwt.expiration=86400000

# Brevo Transactional Email (HTTP API)
brevo.api-key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:noreply@example.com}

cors.allowed-origins=*
