<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organization Details — UEP SORS</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: var(--gray-bg); }

    .page {
      max-width: 900px;
      margin: 48px auto 60px;
      padding: 0 32px;
    }

    /* Org Header Card */
    .org-header-card {
      background: var(--white);
      border-radius: 20px;
      padding: 36px;
      display: flex;
      align-items: center;
      gap: 32px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-border);
      margin-bottom: 24px;
    }

    .org-logo {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      border: 3px solid var(--gray-border);
      flex-shrink: 0;
    }

    .org-info { flex: 1; }

    .org-category {
      display: inline-block;
      background: var(--navy);
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 50px;
      margin-bottom: 10px;
    }

    .org-name {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      color: var(--navy);
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .register-btn {
      display: inline-block;
      padding: 11px 28px;
      background: var(--gold);
      color: var(--navy);
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
    }

    .register-btn:hover {
      background: var(--gold-dark);
      transform: translateY(-1px);
    }

    /* Section Cards */
    .section-card {
      background: var(--white);
      border-radius: 16px;
      padding: 28px 32px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-border);
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: var(--navy);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-text {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.8;
    }

    /* Officers */
    .officers-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .officers-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--gray-bg);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--navy);
    }

    .officers-list li::before {
      content: '👤';
      font-size: 16px;
    }

    /* Back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--navy);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 24px;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--gold-dark); }

    /* Loading/error */
    .loading-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      font-size: 16px;
    }

    .error-state {
      text-align: center;
      padding: 60px 20px;
      color: #dc2626;
      font-size: 15px;
    }

    .committees-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
        margin-top: 8px;
    }

    .committee-item {
        background: var(--navy);
        border-radius: 12px;
        padding: 20px;
    }

    .committee-name {
        font-weight: 700;
        font-size: 14px;
        color: var(--gold);
        margin-bottom: 8px;
    }

    .committee-desc {
        font-size: 13px;
        color: rgba(255,255,255,0.75);
        line-height: 1.6;
    }

    @media (max-width: 640px) {
      .org-header-card { flex-direction: column; text-align: center; }
      .org-logo { width: 100px; height: 100px; }
      .org-name { font-size: 24px; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<header class="site-header">
  <nav class="navbar">
    <a href="dashboard.html" class="nav-logo">
      <div class="nav-logo-img"></div>
      <span class="nav-logo-text">University of Eastern Philippines</span>
    </a>
    <ul class="nav-links">
      <li><a href="dashboard.html">Home</a></li>
      <li><a href="org.html" class="active">Organizations</a></li>
      <li><a href="regu.html">Regulations</a></li>
    </ul>
  </nav>
</header>

<!-- PAGE CONTENT -->
<div class="page">
  <a href="org.html" class="back-link">← Back to Organizations</a>
  <div id="pageContent">
    <div class="loading-state">⏳ Loading organization details...</div>
  </div>
</div>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <div class="footer-logo"></div>
      <div>
        <div class="footer-name">University of Eastern Philippines</div>
        <div class="footer-tagline">University Town, Northern Samar</div>
      </div>
    </div>
    <div class="footer-links-group">
      <a href="https://ueplms.net/studentportal/" target="_blank">Student Portal</a>
      <a href="https://www.facebook.com/UEPOfficialFBPage" target="_blank">Facebook Page</a>
      <a href="http://uep.edu.ph/certificate-of-program-compliance/" target="_blank">UEP COPC</a>
      <a href="https://emailmg.ipage.com/roundcube/" target="_blank">Webmail</a>
    </div>
  </div>
  <div class="footer-bottom">Copyright © 2025 University of Eastern Philippines</div>
</footer>

<script src="config.js"></script>
<script src="sors.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  async function fetchOrg() {
    try {
      const res = await fetch(`${SORS_CONFIG.ORGS_API}/${id}`);
      const org = await res.json();
      renderOrg(org);
    } catch (err) {
      document.getElementById('pageContent').innerHTML = `
        <div class="error-state">
          Failed to load organization. Make sure the backend is running on port 8080.
        </div>`;
    }
  }

  function renderOrg(org) {
    const officersList = org.officers && org.officers.length > 0
      ? org.officers.map(o => `<li>${o}</li>`).join('')
      : '<li>No officers listed.</li>';

    document.getElementById('pageContent').innerHTML = `
      <div class="org-header-card">
        <img src="${org.logoUrl}" alt="${org.name}" class="org-logo" onerror="this.src='imgs/logo.png'">
        <div class="org-info">
          <span class="org-category">${org.category || 'Organization'}</span>
          <div class="org-name">${org.name}</div>
          <a href="register.html?orgId=${org.id}" class="register-btn">Apply to Join</a>
        </div>
      </div>

      <div class="section-card">
        <h2 class="section-title">📋 About the Organization</h2>
        <p class="section-text">${org.description || 'No description available.'}</p>
      </div>

      <div class="section-card">
        <h2 class="section-title">👥 Officers</h2>
        <ul class="officers-list">
          ${officersList}
        </ul>
      </div>

      <div class="section-card">
        <h2 class="section-title">🤝 Be Part of ${org.name}</h2>
        <div class="committees-grid">
          <div class="committee-item">
            <div class="committee-name">Internal Committee</div>
            <p class="committee-desc">Focuses on members' welfare, engagement, and personal development to foster a supportive and collaborative environment within the organization.</p>
          </div>
          <div class="committee-item">
            <div class="committee-name">External Committee</div>
            <p class="committee-desc">Builds partnerships and manages communication with other organizations, institutions, and networks. It also oversees logistics and other requirements needed to ensure activities run smoothly.</p>
          </div>
          <div class="committee-item">
            <div class="committee-name">Finance Committee</div>
            <p class="committee-desc">Manages the organization's financial operations, including budgeting, fundraising, and resource allocation to sustain its programs and activities.</p>
          </div>
          <div class="committee-item">
            <div class="committee-name">Multimedia Committee</div>
            <p class="committee-desc">Handles promotions by producing creative materials such as publications, social media content, and other visual or digital outputs.</p>
          </div>
          <div class="committee-item">
            <div class="committee-name">Documentation Committee</div>
            <p class="committee-desc">Documents and archives the organization's activities and milestones through photos, videos, and written reports to preserve its history and promote transparency.</p>
          </div>
        </div>
      </div>
    `;

    document.title = `${org.name} — UEP SORS`;
  }

  if (id) {
    fetchOrg();
  } else {
    document.getElementById('pageContent').innerHTML = `
      <div class="error-state">No organization selected. <a href="org.html">Go back</a></div>`;
  }
</script>

</body>
</html>
